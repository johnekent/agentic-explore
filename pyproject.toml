[project]
name = "agent-lab"
version = "0.1.0"
description = "Local-first research->classify->index->backlog->match pipeline with Agent Skills + MCP server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "PyYAML>=6.0",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "python-dateutil>=2.9",
  "pydantic>=2.7",
  "mcp>=1.0.0"
]

[project.scripts]
agentlab = "agentlab.cli:app"
agentlab-mcp = "agentlab.mcp.server:main"

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentlab"]
